name: Bug report
description: Report a reproducible problem using synthetic examples.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private questions or real email addresses. Use SECURITY.md for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a synthetic question, language, page and browser when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local public-source starter
        - Hosted platform
        - Independent deployment
